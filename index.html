<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部門自動化排班與值班系統 (即時同步版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (Compat Version 10) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .sticky-header-container {
      position: sticky;
      top: 0;
      z-index: 40;
      background: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 頂部整組凍結容器 (Sticky Header Wrapper) -->
  <div class="sticky-header-container border-b border-slate-200">
    <!-- 1. 頂部深色導航列 -->
    <header class="bg-slate-900 text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center space-x-2">
        <i class="fa-regular fa-calendar-check text-indigo-400 text-lg"></i>
        <h1 class="text-base font-bold tracking-wide">部門自動化排班系統</h1>
        <span id="syncStatus" class="ml-2 text-[11px] px-2 py-0.5 rounded bg-amber-900/60 text-amber-200 border border-amber-700/60 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span>連線檢查中...</span>
        </span>
      </div>
      <div class="flex items-center space-x-1.5 text-xs">
        <button onclick="switchTab('calendar')" id="tab-calendar" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-medium transition">
          <i class="fa-solid fa-calendar-days mr-1"></i>班表月曆
        </button>
        <button onclick="switchTab('rules')" id="tab-rules" class="px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-sliders mr-1"></i>輪替規則設定
        </button>
        <button onclick="switchTab('members')" id="tab-members" class="px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-users mr-1"></i>人員名單
        </button>
        <button onclick="switchTab('logs')" id="tab-logs" class="px-3 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
          <i class="fa-solid fa-clock-rotate-left mr-1"></i>異動紀錄 (Audit Log)
        </button>
      </div>
    </header>

    <!-- 2. 年月控制與功能按鈕列 -->
    <div id="sticky-calendar-bar" class="px-4 py-2 bg-white flex flex-wrap items-center justify-between gap-2 border-b border-slate-100">
      <div class="flex items-center space-x-2">
        <div class="inline-flex rounded-lg shadow-sm border border-slate-200">
          <button onclick="changeMonth(-1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-50 rounded-l-lg border-r border-slate-200 text-xs font-semibold">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="current-month-display" class="px-3 py-1 font-bold text-slate-700 text-sm flex items-center min-w-[120px] justify-center">
            -- 年 -- 月
          </span>
          <button onclick="changeMonth(1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-50 rounded-r-lg text-xs font-semibold">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <button onclick="jumpToCurrentMonth()" class="px-2.5 py-1 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-md border border-indigo-200 font-semibold transition">
          回到本月 (Today)
        </button>
        <button onclick="jumpToMonth(2026, 10)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md border border-slate-200 font-medium transition">
          基準月 (2026/11)
        </button>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="autoScheduleCurrentMonth()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm text-xs font-semibold flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>一鍵依規則自動排班</span>
        </button>
        <button onclick="clearCurrentMonthOverrides()" class="px-2.5 py-1.5 bg-white hover:bg-rose-50 hover:text-rose-600 text-slate-600 border border-slate-200 rounded-lg text-xs font-medium transition">
          重設本月換班
        </button>
        <button onclick="exportData()" class="px-2.5 py-1.5 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1 transition">
          <i class="fa-solid fa-download text-slate-500"></i>
          <span>匯出備份</span>
        </button>
        <label class="px-2.5 py-1.5 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1 cursor-pointer transition">
          <i class="fa-solid fa-upload text-slate-500"></i>
          <span>匯入同步檔</span>
          <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
        </label>
      </div>
    </div>

    <!-- 3. 圖例說明列 -->
    <div id="sticky-legend-bar" class="px-4 py-1.5 bg-slate-50/90 text-xs text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1 border-b border-slate-200">
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-200 border border-slate-300"></span> AOI / KLA 分析 (工作日週輪)</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-sky-200 border border-sky-300"></span> 平日值班 (工作日週輪)</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-200 border border-rose-300"></span> 假日/國定假值班 (依假天數輪)</span>
      <span class="flex items-center gap-1 text-amber-700 font-semibold"><i class="fa-solid fa-pen text-xs"></i> 換班標記</span>
      <span class="flex items-center gap-1 text-red-600 font-semibold"><i class="fa-solid fa-flag text-xs"></i> 國定假日/補假</span>
    </div>

    <!-- 4. 週一至週日 標題列 -->
    <div id="calendar-week-header" class="grid grid-cols-7 text-center font-bold text-xs md:text-sm bg-white">
      <div class="py-2 text-slate-700 border-r border-slate-100">週一</div>
      <div class="py-2 text-slate-700 border-r border-slate-100">週二</div>
      <div class="py-2 text-slate-700 border-r border-slate-100">週三</div>
      <div class="py-2 text-slate-700 border-r border-slate-100">週四</div>
      <div class="py-2 text-slate-700 border-r border-slate-100">週五</div>
      <div class="py-2 text-red-600 bg-red-50/50 border-r border-slate-100">週六</div>
      <div class="py-2 text-red-600 bg-red-50/50">週日</div>
    </div>
  </div>

  <!-- 主內容視圖 (Views) -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 md:p-4">
    <!-- 視圖 1: 班表月曆 -->
    <div id="view-calendar" class="space-y-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div id="calendar-grid" class="grid grid-cols-7 border-collapse bg-slate-200 gap-px"></div>
      </div>
    </div>

    <!-- 視圖 2: 輪替規則設定 -->
    <div id="view-rules" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 class="text-base font-bold text-slate-800">四種值班輪替規則設定</h2>
            <p class="text-xs text-slate-500 mt-0.5">可自訂生效起始日、起始人員與輪替順序。生效日後將自動採用新輪替順序運算！</p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="rules-cards-container"></div>
      </div>
    </div>

    <!-- 視圖 3: 人員名單 -->
    <div id="view-members" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 class="text-base font-bold text-slate-800">部門同仁與代表圖案管理</h2>
            <p class="text-xs text-slate-500 mt-0.5">可在此增減成員、切換 20 種可愛動物頭像</p>
          </div>
          <button onclick="openAddMemberModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-sm transition">
            <i class="fa-solid fa-user-plus mr-1"></i>新增成員
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs md:text-sm">
            <thead class="bg-slate-50 text-slate-600 border-y border-slate-200">
              <tr>
                <th class="py-2.5 px-3">頭像</th>
                <th class="py-2.5 px-3">姓名</th>
                <th class="py-2.5 px-3 text-center">AOI 分析</th>
                <th class="py-2.5 px-3 text-center">KLA 分析</th>
                <th class="py-2.5 px-3 text-center">平日值班</th>
                <th class="py-2.5 px-3 text-center">假日值班</th>
                <th class="py-2.5 px-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="member-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 視圖 4: 異動紀錄 (Audit Log) -->
    <div id="view-logs" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between i
